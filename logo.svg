<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">GitConflux</title>
  <desc id="d">Three coral proposal lines converge into a staging square, then continue as one blue line to a blue check node, next to the GitConflux wordmark.</desc>

  <rect width="580" height="200" fill="#ffffff"/>

  <!-- Mark: proposals converge, get tested together, land on main -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
    <!-- three incoming proposals -->
    <path d="M32 56 C68 56 66 100 96 100" stroke="#ff7a66"/>
    <path d="M32 100 L96 100" stroke="#ff7a66"/>
    <path d="M32 144 C68 144 66 100 96 100" stroke="#ff7a66"/>
    <!-- single outgoing line -->
    <path d="M120 100 L138 100" stroke="#0051c3"/>
  </g>

  <!-- proposal nodes -->
  <g fill="#ff7a66" stroke="#ffffff" stroke-width="4">
    <circle cx="32" cy="56" r="10"/>
    <circle cx="32" cy="100" r="10"/>
    <circle cx="32" cy="144" r="10"/>
  </g>

  <!-- staging square (integration sandbox) -->
  <rect x="94" y="78" width="28" height="44" rx="8" fill="#ffffff" stroke="#0051c3" stroke-width="6"/>

  <!-- main node with check -->
  <circle cx="160" cy="100" r="26" fill="#0051c3"/>
  <path d="M148 100 L156 108 L173 91" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="210" y="118" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'Courier New',monospace" font-size="52" font-weight="700" letter-spacing="-1" fill="#0f2c52"><tspan fill="#0051c3">Git</tspan>Conflux</text>
</svg>
